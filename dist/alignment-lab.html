<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>出纸口透视检查</title><link rel="stylesheet" href="style.css"><script src="geometry.js"></script><style>body{padding:35px;background:#fff}h1{font-size:20px;font-weight:400;margin-bottom:20px}.stages{display:flex;justify-content:center;flex-wrap:wrap;gap:35px}.stage{width:480px;height:610px;position:relative}.stage p{position:absolute;left:20px;bottom:0;font-size:12px;color:#655d6d}.stage .camera-scene{width:460px;height:460px;top:58%;left:50%}.stage .eject-plane{overflow:hidden}</style><h1>同一相机素材与生产页面的纸张层，检查半出片和完整出片。</h1><div class="stages" id="stages"></div><script>
fetch('index.html').then(r=>r.text()).then(html=>{const dom=new DOMParser().parseFromString(html,'text/html');for(const amount of [.35,1]){const stage=document.createElement('section');stage.className='stage';const camera=dom.querySelector('#camera-scene').cloneNode(true);const slot=KeepsakeGeometry.slotLayout(460);Object.assign(camera.querySelector('#eject-window').style,{left:slot.x+'px',top:slot.y+'px',width:slot.width+'px',height:slot.height+'px'});camera.querySelector('#eject-paper').style.transform='translateY('+(101*(1-amount))+'%)';camera.querySelector('#camera').disabled=true;const label=document.createElement('p');label.textContent='相纸送出 '+Math.round(amount*100)+'%';stage.append(camera,label);document.getElementById('stages').append(stage);}});
</script></html>
