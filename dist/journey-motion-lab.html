<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>取景与开场动效校验</title><link rel="stylesheet" href="assets/feel.css"><script src="assets/feel.js"></script><script src="assets/rig.js"></script><style>body{margin:30px;background:#fff;font-family:sans-serif}h1{font-size:21px;font-weight:400}.stage{height:220px;display:grid;place-items:center}.numeral{font:600 170px/1 Arial}.flash-test{width:240px;height:170px;background:url('assets/capture/02.jpg') center/contain #222;position:relative;border:9px solid #282b29;border-radius:15px}.flash-test i{position:absolute;inset:0;background:#fff}</style><h1>数字显现与快门闪光</h1><p>制作校验页。与纪念页相同的质量、频率和阻尼。</p><div id="opening-rig"></div><div id="flash-rig"></div><script>
function rig(host,freq,stage,styles,title,restX,restV){const body=new Feel.Body({mass:1,freq,zeta:1,x:0,target:0,restX,restV,onFrame:b=>Feel.paint(styles(b))});Feel.rig(document.getElementById(host),{body,stage,travel:[0,1],stops:[0,1],feel:'gentle',title,actions:[{key:'1',label:'显现',run:()=>body.to(1)},{key:'0',label:'消退',run:()=>body.to(0)}]});Feel.paint(styles(body));}
const s=document.createElement('div');s.className='stage';const n=document.createElement('div');n.className='numeral';n.textContent='6';s.append(n);rig('opening-rig',.16,s,b=>[[n,{opacity:Math.max(0,Math.min(1,b.x))}]],'0.16 Hz · 数字 6',.003,.0015);
const t=document.createElement('div');t.className='stage';const w=document.createElement('div');w.className='flash-test';const f=document.createElement('i');w.append(f);t.append(w);rig('flash-rig',1.6,t,b=>[[f,{opacity:Math.max(0,Math.min(1,b.x))}]],'1.6 Hz · 闪光',.008,.0064);
</script></html>
