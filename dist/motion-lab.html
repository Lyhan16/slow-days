<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>相纸动效校验台</title><link rel="stylesheet" href="assets/feel.css"><script src="assets/feel.js"></script><script src="assets/rig.js"></script><style>body{margin:30px;background:#fff;font-family:sans-serif}h1{font-size:20px;font-weight:400}.paper{width:95px;height:150px;background:#fdfcfa;border:1px solid #eee;box-shadow:0 5px 12px #0001;position:absolute;left:50%;top:45px;margin-left:-48px}.paper:before{content:'';position:absolute;inset:8px 8px 30px;background:#e0ddd8}</style><h1>相纸动效校验台</h1><p>本页供制作校验使用，不出现在纪念页中。对照实际位置与模型预测，检查落纸和翻面。</p><div id="lab"></div><script>
const stage=document.createElement('div');const paper=document.createElement('div');paper.className='paper';stage.append(paper);
const body=new Feel.Body({feel:'light, gentle',x:0,target:0,min:0,max:150,onFrame:b=>Feel.paint([[paper,{transform:`translateY(${b.x}px)`}]])});
Feel.rig(document.getElementById('lab'),{body,stage,travel:[0,150],stops:[0,150],feel:'light, gentle',actions:[{label:'送出相纸',run:()=>body.to(150)},{label:'收回',run:()=>body.to(0)}]});
</script></html>
