<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>木夹悬挂摆动校验</title><link rel="stylesheet" href="assets/feel.css"><script src="assets/feel.js"></script><script src="assets/rig.js"></script><style>body{margin:30px;background:#fff;font-family:sans-serif}h1{font-size:20px;font-weight:400}.stage{position:relative;height:255px}.paper{width:95px;height:151px;position:absolute;left:50%;top:45px;margin-left:-48px;transform-origin:50% -9px;background:#fffefa;padding:7px 7px 29px;box-shadow:1px 5px 12px #3c32351f;border:1px solid #eae3db}.paper img{width:100%;height:100%;object-fit:cover}.pin{position:absolute;width:11px;height:30px;left:50%;top:26px;margin-left:-5px;background:linear-gradient(90deg,#ba9767,#e4ccaa,#ae875b);border-radius:2px;z-index:1}</style><h1>木夹下方的相纸，受力后自然回摆。</h1><p>此页只用于制作校验，不在纪念页中显示。质量 .35，频率 1.35 Hz，阻尼比 .30。</p><div id="lab"></div><script>
const stage=document.createElement('div');stage.className='stage';const paper=document.createElement('div');paper.className='paper';const img=new Image();img.src='assets/memory-01.jpg';paper.append(img);const pin=document.createElement('span');pin.className='pin';stage.append(pin,paper);
const styles=b=>[[paper,{transform:'rotate('+b.x+'deg)'}]];const body=new Feel.Body({mass:.35,freq:1.35,zeta:.30,x:0,target:0,unit:'°',restX:.02,restV:.04,onFrame:b=>Feel.paint(styles(b))});const handoff=Feel.handoff(body,styles);
Feel.rig(document.getElementById('lab'),{body,stage,travel:[-5,5],stops:[-4,0,4],feel:'airy',title:'相纸绕木夹摆动',unit:'°',handoff,actions:[{key:'1',label:'从左边掠过',run:()=>body.kick(-13)},{key:'2',label:'从右边掠过',run:()=>body.kick(13)},{key:'0',label:'静止',run:()=>body.jump(0)}]});
</script></html>
