<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晾绳翻页回摆校验</title><link rel="stylesheet" href="assets/feel.css"><script src="assets/feel.js"></script><script src="assets/rig.js"></script><style>body{margin:30px;font-family:sans-serif;background:#fff}h1{font-size:21px;font-weight:400}.stage{height:220px;display:flex;justify-content:center;gap:40px;padding-top:24px}.print{width:84px;height:134px;padding:6px 6px 24px;transform-origin:50% 0;background:#fffefa;box-shadow:1px 5px 12px #3c32351f}.print img{width:100%;height:100%;object-fit:cover}</style><h1>每张相纸绕自己的木夹倾斜。</h1><p>左翻时底边向右，右翻时底边向左。质量 1，频率 2.8 Hz，阻尼比 .82。</p><div id="lab"></div><script>
const stage=document.createElement('div');stage.className='stage';const prints=[];for(const n of ['01','02','03']){const p=document.createElement('div');p.className='print';const i=new Image();i.src='assets/personal/'+n+'.jpg';p.append(i);stage.append(p);prints.push(p);}
const styles=b=>prints.map(p=>[p,{transform:'rotateZ('+b.x+'deg)'}]);const body=new Feel.Body({mass:1,freq:2.8,zeta:.82,x:0,target:0,unit:'°',restX:.03,restV:.1,onFrame:b=>Feel.paint(styles(b))});Feel.rig(document.getElementById('lab'),{body,stage,travel:[-8,8],stops:[-6,0,6],title:'翻页带来的风',unit:'°',feel:'airy',actions:[{key:'1',label:'左翻',run:()=>body.to(-6)},{key:'2',label:'右翻',run:()=>body.to(6)},{key:'0',label:'翻页结束',run:()=>body.to(0)}]});
</script></html>
